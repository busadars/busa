<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Emerald Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Ledger Left Page (Solid Emerald/Mint) -->
    <linearGradient id="left-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Ledger Right Page (Glassy White Outline) -->
    <linearGradient id="right-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Premium 3D Shadows & Glows -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-effect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Subtle Inner Glass Border -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Main Graphic Container -->
  <g filter="url(#soft-shadow)">
    
    <!-- Left Side: Solid Geometric Book Page -->
    <path d="M 112 160 H 208 C 234.5 160 256 181.5 256 208 V 384 C 256 357.5 234.5 336 208 336 H 112 V 160 Z" fill="url(#left-page)"/>
    
    <!-- Right Side: Translucent White Book Outline -->
    <path d="M 400 160 H 304 C 277.5 160 256 181.5 256 208 V 384 C 256 357.5 277.5 336 304 336 H 400 V 160 Z" fill="none" stroke="url(#right-page)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Finance Element: Upward Growth Arrow embedded on the right page -->
    <path d="M 288 280 L 328 240 L 368 280" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="328" y1="240" x2="328" y2="310" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

    <!-- Center Book Binding Line -->
    <line x1="256" y1="190" x2="256" y2="390" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8"/>
    
  </g>

  <!-- Top Floating Glowing Sparkle (Represents wealth/success) -->
  <path d="M 256 64 L 272 96 L 304 112 L 272 128 L 256 160 L 240 128 L 208 112 L 240 96 Z" fill="#ffffff" filter="url(#glow-effect)"/>

</svg>
