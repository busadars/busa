<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Premium Background (Slate to Dark Emerald) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Finance Card (Mint to Emerald) -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Frosted Glass Wallet Pocket -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.85" />
    </linearGradient>

    <!-- High-end Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Base (Smooth Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Tech/Finance Background Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.05" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.03" />

  <g transform="translate(0, 8)">
      <!-- The Ledger Card -->
      <rect x="152" y="88" width="208" height="280" rx="24" fill="url(#cardGrad)" filter="url(#shadow)" />
      
      <!-- Card Details: Upward Trend Chart -->
      <circle cx="192" cy="196" r="8" fill="#ffffff" />
      <path d="M 192 196 L 224 164 L 256 196 L 312 140" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 312 140 V 176 M 312 140 H 276" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

      <!-- The Glass Wallet Pocket -->
      <path d="M 96 280 C 96 262.327 110.327 248 128 248 H 384 C 401.673 248 416 262.327 416 280 V 384 C 416 401.673 401.673 416 384 416 H 128 C 110.327 416 96 401.673 96 384 V 280 Z" fill="url(#glassGrad)" filter="url(#glassShadow)" />
      
      <!-- Glass Top Edge Highlight -->
      <path d="M 128 250 H 384" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

      <!-- Wallet Pocket Curved Cutout Detail -->
      <path d="M 96 280 C 160 328 352 328 416 280" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

      <!-- Modern FinTech Chip/Badge on the Wallet -->
      <rect x="232" y="328" width="48" height="32" rx="8" fill="#cbd5e1" stroke="#ffffff" stroke-width="4" />
      <circle cx="256" cy="344" r="4" fill="#94a3b8" />
  </g>
</svg>
