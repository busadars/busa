<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Premium Dark Slate Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 3D Lighting for Cylinder Bodies -->
    <linearGradient id="body1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="15%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="body2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="15%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="body3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="15%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Gradients for Top Ellipses -->
    <linearGradient id="top1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="top2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="top3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Premium Drop Shadows -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#047857" flood-opacity="0.6" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.08" />

  <!-- Abstract Back Glow -->
  <circle cx="256" cy="256" r="140" fill="#34d399" filter="url(#glow)" opacity="0.15" />

  <!-- ================= BOTTOM COIN (Layer 3) ================= -->
  <g filter="url(#shadow)">
    <path d="M 126 314 v 45 a 130 65 0 0 0 260 0 v -45 z" fill="url(#body3)" />
    <ellipse cx="256" cy="314" rx="130" ry="65" fill="url(#top3)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- ================= MIDDLE COIN (Layer 2) ================= -->
  <g filter="url(#shadow)">
    <path d="M 126 234 v 45 a 130 65 0 0 0 260 0 v -45 z" fill="url(#body2)" />
    <ellipse cx="256" cy="234" rx="130" ry="65" fill="url(#top2)" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- ================= TOP COIN (Layer 1) ================= -->
  <g filter="url(#shadow)">
    <path d="M 126 154 v 45 a 130 65 0 0 0 260 0 v -45 z" fill="url(#body1)" />
    <ellipse cx="256" cy="154" rx="130" ry="65" fill="url(#top1)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" />
    
    <!-- 3D Isometric Growth Arrow Embedded on Top Coin -->
    <g transform="translate(256, 154) scale(1, 0.5) rotate(-45)" filter="url(#arrowShadow)">
      <path d="M -35 35 L 35 -35 M 5 -35 L 35 -35 L 35 -5" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

</svg>
